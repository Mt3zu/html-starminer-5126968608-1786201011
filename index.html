<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f5f5f7"><meta name="apple-mobile-web-app-capable" content="yes">
<title>StarMiner</title><style>
@import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&display=swap');
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif;color:#111;--bg:#f5f5f7;--card:rgba(255,255,255,.78);--blue:#007aff;--green:#34c759;--red:#ff3b30;--gold:#ffcc00;--line:rgba(60,60,67,.13)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#f8f8fa,#ececf1);min-height:100vh}button,input{font:inherit}.app-shell{max-width:520px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}.topbar{height:92px;padding:18px 20px 8px;display:flex;align-items:flex-end;justify-content:space-between;position:sticky;top:0;z-index:4;background:rgba(245,245,247,.78);backdrop-filter:blur(22px)}.eyebrow{font-size:13px;color:#8e8e93;font-weight:600}.topbar h1{margin:2px 0;font-size:30px;letter-spacing:-1px}.avatar{width:42px;height:42px;border:0;border-radius:50%;background:#fff;box-shadow:0 5px 18px #0001}.content{padding:14px 16px 105px}.hero{padding:22px;border-radius:28px;background:linear-gradient(135deg,#111,#30343b);color:white;box-shadow:0 14px 30px #0002}.hero .brand{font-size:14px;color:#b9bdc5}.hero .points{font-size:44px;font-weight:700;letter-spacing:-2px;margin:10px 0}.hero .sub{color:#c7cad0}.energy{margin-top:16px;height:9px;background:#ffffff25;border-radius:20px;overflow:hidden}.energy i{display:block;height:100%;background:#34c759;border-radius:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.card,.list-card{background:var(--card);border:1px solid #fff9;border-radius:22px;padding:16px;box-shadow:0 8px 25px #0000000a;backdrop-filter:blur(16px)}.stat{font-size:12px;color:#8e8e93}.big{font-size:22px;font-weight:700;margin-top:5px}.section-title{font-size:20px;font-weight:700;margin:24px 3px 10px}.action{width:100%;border:0;border-radius:18px;padding:15px 14px;background:#fff;text-align:right;display:flex;align-items:center;gap:12px;box-shadow:0 4px 14px #0000000b;margin:9px 0;cursor:pointer}.action .ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:#f1f1f5;font-size:20px}.action b{display:block}.action small{display:block;color:#8e8e93;margin-top:3px}.primary{background:var(--blue);color:#fff}.mine{width:100%;border:0;border-radius:24px;padding:19px;margin-top:14px;background:var(--blue);color:#fff;font-size:18px;font-weight:700;box-shadow:0 10px 25px #007aff44}.mine:active{transform:scale(.98)}.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:82px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(250,250,252,.86);backdrop-filter:blur(24px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:5}.tabbar button{border:0;background:none;color:#8e8e93;font-size:22px}.tabbar button span{display:block;font-size:10px;margin-top:3px}.tabbar button.active{color:var(--blue)}.pill{display:inline-block;padding:7px 10px;border-radius:20px;background:#eef0f4;color:#555;font-size:12px}.gold{color:#9a7300;background:#fff5c7}.danger{color:#b42318;background:#ffe8e6}.success{color:#137333;background:#e3f7e9}.modal{position:fixed;inset:0;background:#0005;z-index:20;display:grid;align-items:end}.modal.hidden{display:none}.sheet{background:#f7f7f9;border-radius:28px 28px 0 0;padding:20px;max-height:85vh;overflow:auto}.sheet h2{margin-top:0}.sheet input{width:100%;border:1px solid #ddd;border-radius:14px;padding:14px;background:#fff;margin:7px 0}.sheet button{border:0;border-radius:14px;padding:13px 16px;background:#007aff;color:#fff;font-weight:600;margin-top:8px}.close{background:#e5e5ea!important;color:#111!important}.empty{text-align:center;color:#8e8e93;padding:30px}.table-row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}#toast{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-20px);opacity:0;background:#111;color:#fff;padding:12px 18px;border-radius:18px;z-index:50;transition:.25s;pointer-events:none;font-size:14px}#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

</style>
</head><body>
<div class="app-shell">
  <header class="topbar"><div><div class="eyebrow">StarMiner</div><h1 id="pageTitle">الرئيسية</h1></div><button class="avatar" onclick="openScreen('profile')">👤</button></header>
  <main id="app" class="content"></main>
  <nav class="tabbar">
    <button data-screen="home" onclick="openScreen('home')">⌂<span>الرئيسية</span></button>
    <button data-screen="store" onclick="openScreen('store')">★<span>المتجر</span></button>
    <button data-screen="gangs" onclick="openScreen('gangs')">♛<span>العصابات</span></button>
    <button data-screen="profile" onclick="openScreen('profile')">◎<span>حسابي</span></button>
  </nav>
</div>
<div id="toast"></div><div id="modal" class="modal hidden"></div>
<script>
const ADMIN_ID=5126968608, ADMIN_USERNAME='@toe7e';
const defaults={name:'مستخدم StarMiner',id:Date.now()%9000000000+1000000000,points:0,energy:500,mineCount:0,referrals:0,gangId:0,shieldUntil:0,banned:false,captcha:true,refReward:500,discount:0,storeDisabled:false,gangsDisabled:false,securityDisabled:false,maintenance:false,bankReserve:1000000,bankTax:10,star15:1500,star25:2500,spinReady:true,giftUses:{}};
let state=JSON.parse(localStorage.getItem('starmine_state')||'null')||structuredClone(defaults);let gangs=JSON.parse(localStorage.getItem('starmine_gangs')||'[]');let users=JSON.parse(localStorage.getItem('starmine_users')||'[]');let current='home';
function save(){localStorage.setItem('starmine_state',JSON.stringify(state));localStorage.setItem('starmine_gangs',JSON.stringify(gangs));localStorage.setItem('starmine_users',JSON.stringify(users))}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function title(){let n=state.mineCount;return n>=1000?'أسطورة النجوم':n>=500?'خبير التعدين':n>=100?'ملك التعدين':n>=25?'معدّن محترف':'مبتدئ'}
function openScreen(s){current=s;render()}
function setHeader(t){document.getElementById('pageTitle').textContent=t;document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('active',b.dataset.screen===current))}
function render(){let a=document.getElementById('app');if(current==='home'){setHeader('الرئيسية');a.innerHTML=home()}else if(current==='store'){setHeader('المتجر');a.innerHTML=store()}else if(current==='gangs'){setHeader('العصابات');a.innerHTML=gangsView()}else if(current==='profile'){setHeader('حسابي');a.innerHTML=profile()}else if(current==='security'){setHeader('الحماية والسرقة');a.innerHTML=security()}else if(current==='transfer'){setHeader('تحويل النقاط');a.innerHTML=transfer()}else if(current==='bank'){setHeader('البنك المركزي');a.innerHTML=bank()}else if(current==='ref'){setHeader('دعوة الأصدقاء');a.innerHTML=referrals()}else if(current==='spin'){setHeader('عجلة الحظ');a.innerHTML=spin()}else if(current==='top'){setHeader('توب الإحالات');a.innerHTML=topRefs()}else if(current==='help'){setHeader('التعليمات');a.innerHTML=help()}else if(current==='admin'){setHeader('لوحة الأدمن');a.innerHTML=admin()}else if(current==='redeem'){setHeader('كود النقاط');a.innerHTML=redeem()}}
function home(){let pct=state.energy/5;return `<div class="hero"><div class="brand">🚀 StarMiner • بوت تعدين النجوم</div><div class="points">${state.points.toLocaleString('ar-IQ')} 🪙</div><div class="sub">${state.name} • ${title()}</div><div class="energy"><i style="width:${pct}%"></i></div><div class="sub" style="margin-top:7px">⚡ الطاقة ${state.energy}/500</div></div><button class="mine" onclick="mine()">🇮🇶 أنا أحب العراق <span>+5</span></button><div class="grid"><div class="card"><div class="stat">التعدين</div><div class="big">${state.mineCount}</div></div><div class="card"><div class="stat">الإحالات</div><div class="big">${state.referrals}</div></div></div><div class="section-title">الخدمات</div>${action('★','عجلة الحظ','محاولة يومية للحصول على نقاط','spin')}${action('⭐','متجر النجوم','تحويل النقاط إلى نجوم','store')}${action('🔄','تحويل نقاط','تحويل مباشر أو رابط','transfer')}${action('🛡️','حماية وسرقة','درع حماية وهجمات','security')}${action('♛','عصابات التعدين','إنشاء أو الانضمام إلى عصابة','gangs')}${action('🏦','البنك المركزي','الاحتياطي والضريبة','bank')}${action('🎁','كود النقاط','استبدال كود هدية','redeem')}${action('👥','دعوة الأصدقاء','رابط إحالة ومكافآت','ref')}${action('🏆','توب الإحالات','أفضل المحيلين','top')}${action('📖','التعليمات','دليل استخدام التطبيق','help')}${state.id===ADMIN_ID?action('👑','لوحة الأدمن','إدارة النظام','admin'):''}`}
function action(i,t,s,screen){return `<button class="action" onclick="openScreen('${screen}')"><span class="ico">${i}</span><span><b>${t}</b><small>${s}</small></span></button>`}
function mine(){if(state.banned)return toast('🚫 الحساب محظور');if(state.maintenance)return toast('⛔ التطبيق في وضع الصيانة');if(state.energy<=0)return toast('❌ نفدت الطاقة، تتجدد كل 24 ساعة');state.energy--;state.points+=5;state.mineCount++;syncUser();save();toast('🇮🇶 +5 نقاط!');render()}
function store(){let d=state.discount,c15=Math.floor(state.star15*(100-d)/100),c25=Math.floor(state.star25*(100-d)/100);return `<div class="card"><div class="stat">رصيدك الحالي</div><div class="big">${state.points.toLocaleString()} 🪙</div>${d?`<span class="pill gold">🔥 خصم ${d}%</span>`:''}</div><div class="section-title">⭐ نجوم تيليجرام</div>${buyAction('15 نجمة',c15)}${buyAction('25 نجمة',c25)}<div class="section-title">ملاحظة</div><div class="card">في النسخة المحلية يتم تسجيل الطلب داخل التطبيق. ربط التسليم الفعلي يحتاج Backend/Telegram.</div>`}
function buyAction(stars,cost){return `<button class="action" onclick="buyStars(${cost},'${stars}')"><span class="ico">⭐</span><span><b>${stars}</b><small>${cost.toLocaleString()} نقطة</small></span></button>`}
function buyStars(cost,stars){if(state.storeDisabled&&state.id!==ADMIN_ID)return toast('⛔ الشراء متوقف');if(state.points<cost)return toast('❌ رصيدك لا يكفي');state.points-=cost;save();toast(`✅ تم إنشاء طلب ${stars}`);render()}
function transfer(){return `<div class="card">🔄 عمولة التحويل: <b>10%</b></div><div class="section-title">اختر الطريقة</div>${action('🆔','تحويل مباشر عبر الآيدي','إرسال نقاط لمستخدم','transferId')}${action('🔗','إنشاء رابط تحويل','إنشاء رابط حصري بالنقاط','transferLink')}`}
function transferId(){openModal('تحويل مباشر',`<input id="tid" inputmode="numeric" placeholder="آيدي المستلم"><input id="tamt" inputmode="numeric" placeholder="عدد النقاط"><button onclick="doTransfer()">إرسال</button><button class="close" onclick="closeModal()">إلغاء</button>`)}
function transferLink(){openModal('رابط تحويل',`<input id="tlinkamt" inputmode="numeric" placeholder="عدد النقاط"><button onclick="doLink()">إنشاء الرابط</button><button class="close" onclick="closeModal()">إلغاء</button>`)}
function doTransfer(){let id=Number(document.getElementById('tid').value),amt=Number(document.getElementById('tamt').value);if(!id||amt<=0||state.points<amt)return toast('❌ بيانات غير صحيحة أو رصيد غير كاف');state.points-=amt;save();closeModal();toast(`✅ تم تحويل ${amt} نقطة`);render()}
function doLink(){let amt=Number(document.getElementById('tlinkamt').value);if(amt<=0||state.points<amt)return toast('❌ مبلغ غير صالح');let fee=Math.ceil(amt*.1),token='STAR-'+Math.random().toString(36).slice(2,8).toUpperCase();state.points-=amt;save();closeModal();openModal('رابط التحويل',`<div class="card"><b>${token}</b><p>المبلغ: ${amt} نقطة<br>العمولة: ${fee} نقطة</p></div><button onclick="closeModal()">تم</button>`);render()}
function security(){if(state.securityDisabled)return `<div class="card">⛔ نظام الحماية والسرقة متوقف حالياً.</div>`;let left=Math.max(0,state.shieldUntil-Date.now());return `<div class="card"><div class="stat">حالة الدرع</div><div class="big">${left?'🛡️ مفعل':'⚪ غير مفعل'}</div><small>${left?Math.ceil(left/60000)+' دقيقة متبقية':'يمنحك الحماية لمدة ساعة'}</small></div>${action('🛡️','شراء درع حماية','5000 نقطة / ساعة','buyShield')}${action('🦹','سرقة نقاط من مستخدم','محاولة عشوائية مع غرامة عند الفشل','steal')}`}
function buyShield(){if(state.points<5000)return toast('❌ تحتاج 5000 نقطة');state.points-=5000;state.shieldUntil=Date.now()+3600000;save();toast('🛡️ تم تفعيل الدرع لمدة ساعة');openScreen('security')}
function steal(){openModal('هجوم على مستخدم',`<input id="target" inputmode="numeric" placeholder="آيدي المستخدم"><button onclick="doSteal()">شن الهجوم</button><button class="close" onclick="closeModal()">إلغاء</button>`)}
function doSteal(){if(Date.now()>state.shieldUntil)return toast('⛔ فعّل درع الحماية أولاً');let target=Number(document.getElementById('target').value);if(!target||target===state.id)return toast('❌ آيدي غير صالح');let success=Math.random()<.5;if(success){let stolen=50+Math.floor(Math.random()*151);state.points+=stolen;toast(`🦹 نجحت العملية +${stolen}`)}else{state.points=Math.max(0,state.points-300);toast('❌ فشلت العملية وغرامة 300 نقطة')}save();closeModal();render()}
function bank(){return `<div class="hero"><div class="brand">🏦 البنك المركزي</div><div class="points">${state.bankReserve.toLocaleString()} 🪙</div><div class="sub">ضريبة العمليات: ${state.bankTax}%</div></div><div class="card" style="margin-top:14px">ينظم اقتصاد التطبيق ويحفظ الاحتياطي والضرائب.</div>`}
function gangsView(){if(state.gangsDisabled)return `<div class="card">⛔ نظام العصابات متوقف حالياً.</div>`;let g=gangs.find(x=>x.id===state.gangId);let info=g?`<div class="card"><b>🏛️ ${g.name}</b><p>الرصيد: ${g.balance.toLocaleString()} نقطة<br>الأعضاء: ${g.members}</p></div>`:`<div class="card">❌ لست منضم لأي عصابة</div>`;return info+(g?action('💰','التبرع للعصابة','إضافة نقاط لصندوق العصابة','donate'):action('➕','إنشاء عصابة جديدة','التكلفة 10000 نقطة','createGang'))+action('📜','قائمة العصابات','استعراض العصابات والانضمام','gangList')+(g?action('🚪','مغادرة العصابة','مغادرة العصابة الحالية','leaveGang'):'')+(g&&g.leader===state.id?action('🗑️','حذف العصابة','حذف نهائي','deleteGang'):'')}`}
function createGang(){openModal('إنشاء عصابة',`<input id="gname" placeholder="اسم العصابة"><button onclick="doCreateGang()">إنشاء بـ 10000 نقطة</button><button class="close" onclick="closeModal()">إلغاء</button>`)}
function doCreateGang(){let n=document.getElementById('gname').value.trim();if(!n||state.points<10000)return toast('❌ الاسم غير صالح أو الرصيد غير كاف');let g={id:Date.now(),name:n,balance:0,members:1,leader:state.id};gangs.push(g);state.points-=10000;state.gangId=g.id;save();closeModal();toast('🏛️ تم إنشاء العصابة');render()}
function gangList(){openModal('العصابات',gangs.length?gangs.map(g=>`<button class="action" onclick="joinGang(${g.id})"><span class="ico">♛</span><span><b>${g.name}</b><small>${g.members} أعضاء • ${g.balance} نقطة</small></span></button>`).join(''):`<div class="empty">لا توجد عصابات بعد.</div><button class="close" onclick="closeModal()">إغلاق</button>`)}
function joinGang(id){if(state.gangId)return toast('❌ أنت منضم لعصابة');let g=gangs.find(x=>x.id===id);if(!g)return;g.members++;state.gangId=id;save();closeModal();toast('✅ انضممت للعصابة');render()}
function leaveGang(){let g=gangs.find(x=>x.id===state.gangId);if(!g)return;g.members=Math.max(0,g.members-1);state.gangId=0;save();toast('🚪 غادرت العصابة');render()}
function deleteGang(){let g=gangs.find(x=>x.id===state.gangId);if(!g||g.leader!==state.id)return toast('❌ أنت لست القائد');gangs=gangs.filter(x=>x.id!==g.id);state.gangId=0;save();toast('🗑️ تم حذف العصابة');render()}
function donate(){let g=gangs.find(x=>x.id===state.gangId);openModal('تبرع',`<input id="don" inputmode="numeric" placeholder="عدد النقاط"><button onclick="doDonate()">تبرع</button><button class="close" onclick="closeModal()">إلغاء</button>`)}
function doDonate(){let n=Number(document.getElementById('don').value),g=gangs.find(x=>x.id===state.gangId);if(!g||n<=0||state.points<n)return toast('❌ مبلغ غير صالح');state.points-=n;g.balance+=n;save();closeModal();toast('💰 تم التبرع');render()}
function referrals(){let link=`https://t.me/${ADMIN_USERNAME.replace('@','')}?start=${state.id}`;return `<div class="hero"><div class="brand">👥 رابط الإحالة</div><div class="points">${state.referrals}</div><div class="sub">إحالاتك • المكافأة ${state.refReward} نقطة</div></div><div class="card" style="margin-top:14px;word-break:break-all">${link}</div><button class="mine" onclick="navigator.clipboard?.writeText('${link}');toast('🔗 تم نسخ الرابط')">نسخ رابط الدعوة</button>`}
function spin(){return `<div class="card" style="text-align:center"><div style="font-size:80px">🎡</div><h2>عجلة الحظ</h2><p>جرّب حظك واحصل على نقاط.</p><button class="mine" onclick="doSpin()">لف العجلة</button></div>`}
function doSpin(){let rewards=[50,100,150,250,500,1000],r=rewards[Math.floor(Math.random()*rewards.length)];state.points+=r;save();toast(`🎉 ربحت ${r} نقطة`);render()}
function topRefs(){let list=[...users,{name:state.name,referrals:state.referrals}].sort((a,b)=>(b.referrals||0)-(a.referrals||0)).slice(0,10);return `<div class="card">${list.map((u,i)=>`<div class="table-row"><b>#${i+1} ${u.name||'مستخدم'}</b><span>${u.referrals||0} إحالة</span></div>`).join('')}</div>`}
function profile(){return `<div class="hero"><div class="brand">📊 معلومات الحساب</div><div class="points">${state.points.toLocaleString()} 🪙</div><div class="sub">${title()}</div></div><div class="card" style="margin-top:14px">${row('👤 الاسم',state.name)}${row('🆔 الآيدي',state.id)}${row('🏅 اللقب',title())}${row('🔨 التعدين',state.mineCount)}${row('⚡ الطاقة',state.energy+'/500')}${row('👥 الإحالات',state.referrals)}${row('✅ التحقق','مؤكد')}</div>`}
function row(a,b){return `<div class="table-row"><span>${a}</span><b>${b}</b></div>`}
function help(){return `<div class="card"><h3>📖 دليل StarMiner</h3><p>1️⃣ التعدين: اضغط أنا أحب العراق لتحصل على 5 نقاط وتستهلك طاقة.</p><p>2️⃣ الحماية: شراء الدرع يتيح لك الهجوم لمدة ساعة، والفشل يخصم 300 نقطة.</p><p>3️⃣ العصابات: الإنشاء يكلف 10,000 نقطة، ويمكن التبرع والانضمام.</p><p>4️⃣ التحويل: توجد عمولة 10% على التحويلات.</p><p>5️⃣ المتجر: في هذه النسخة يتم تسجيل عملية الشراء محلياً.</p></div><button class="mine" onclick="location.href='https://t.me/${ADMIN_USERNAME.replace('@','')}'">👨‍💻 التواصل مع المطور</button>`}
function redeem(){return `<div class="card"><h3>🎁 كود النقاط</h3><p>أدخل كود هدية لإضافة النقاط.</p><input id="gift" style="width:100%;padding:14px;border:1px solid #ddd;border-radius:14px" placeholder="مثال: STAR100"><button class="mine" onclick="redeemCode()">استبدال الكود</button></div>`}
function redeemCode(){let c=document.getElementById('gift').value.trim().toUpperCase(),map={STAR100:100,STAR500:500,STAR1000:1000};if(!map[c])return toast('❌ الكود غير صالح');if(state.giftUses[c])return toast('❌ استخدمت الكود سابقاً');state.giftUses[c]=1;state.points+=map[c];save();toast(`🎉 +${map[c]} نقطة`);render()}
function admin(){return `<div class="card"><h3>👑 لوحة الأدمن</h3><p>هذه الواجهة المحلية تحاكي إعدادات الإدارة الأساسية.</p>${row('المتجر',state.storeDisabled?'معطل':'مفعل')}${row('العصابات',state.gangsDisabled?'معطلة':'مفعلة')}${row('الحماية',state.securityDisabled?'معطلة':'مفعلة')}${row('الصيانة',state.maintenance?'مفعلة':'معطلة')}</div>${action('⭐','تبديل المتجر','تشغيل/إيقاف','admStore')}${action('♛','تبديل العصابات','تشغيل/إيقاف','admGangs')}${action('🛡️','تبديل الحماية','تشغيل/إيقاف','admSec')}${action('🧹','وضع الصيانة','تشغيل/إيقاف','admMaint')}${action('🪙','إضافة نقاط','للحساب الحالي','admGive')}`}
function admStore(){state.storeDisabled=!state.storeDisabled;save();render()}function admGangs(){state.gangsDisabled=!state.gangsDisabled;save();render()}function admSec(){state.securityDisabled=!state.securityDisabled;save();render()}function admMaint(){state.maintenance=!state.maintenance;save();render()}function admGive(){openModal('إضافة نقاط',`<input id="give" inputmode="numeric" placeholder="عدد النقاط"><button onclick="let n=Number(document.getElementById('give').value);if(n>0){state.points+=n;save();closeModal();toast('🪙 تمت الإضافة');render()}">إضافة</button><button class="close" onclick="closeModal()">إلغاء</button>`)}
function openModal(title,body){document.getElementById('modal').innerHTML=`<div class="sheet"><h2>${title}</h2>${body}</div>`;document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}
function syncUser(){let i=users.findIndex(x=>x.id===state.id);let u={id:state.id,name:state.name,referrals:state.referrals};if(i<0)users.push(u);else users[i]=u}
window.openScreen=openScreen;window.mine=mine;window.buyStars=buyStars;window.transferId=transferId;window.transferLink=transferLink;window.doTransfer=doTransfer;window.doLink=doLink;window.buyShield=buyShield;window.steal=steal;window.doSteal=doSteal;window.createGang=createGang;window.doCreateGang=doCreateGang;window.gangList=gangList;window.joinGang=joinGang;window.leaveGang=leaveGang;window.deleteGang=deleteGang;window.donate=donate;window.doDonate=doDonate;window.doSpin=doSpin;window.redeemCode=redeemCode;window.closeModal=closeModal;
syncUser();save();render();

</script>
</body></html>
